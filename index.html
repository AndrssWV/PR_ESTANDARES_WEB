<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cafetería del Parque</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header>
    <img src="img/cafe.svg" alt="Taza de café" width="70" height="70">
    <h1>Cafetería del Parque</h1>
  </header>

  <nav aria-label="Navegación principal">
    <ul>
      <li><a href="#inicio">Inicio</a></li>
      <li><a href="#menu">Menú</a></li>
      <li><a href="#pedido">Pedido</a></li>
    </ul>
  </nav>

  <div class="layout" id="inicio">
    <main>
      <section>
        <h2>Bienvenidos</h2>
      </section>

      <section id="menu">
        <h2>Menú</h2>
        <table>
          <caption>Productos y precios</caption>
          <thead>
            <tr>
              <th>Producto</th>
              <th>Descripción</th>
              <th>Precio</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <th>Americano</th>
              <td>Café negro</td>
              <td>$1,50</td>
            </tr>
            <tr>
              <th>Capuchino</th>
              <td>Café con leche espumada</td>
              <td>$2,25</td>
            </tr>
            <tr>
              <th>Chocolate</th>
              <td>Bebida caliente de cacao</td>
              <td>$2,00</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <section id="pedido">
    <h2>Pedido</h2>
    <form>
      <fieldset>
        <label >Nombre:</label>
        <input type="text">

        <label >Correo electrónico:</label>
        <input type="email">

        <label >Teléfono:</label>
        <input type="tel">

        <label >Hora de retiro:</label>
        <input type="time">

        <label for="cantidad">Cantidad:</label>
        <input type="number">
      </fieldset>

      <fieldset>
        <p>Seleccionar:</p>
        <label><input type="checkbox" value="Chocolate"> Chocolate</label>
        <label><input type="checkbox" value="Americano"> Americano</label>
        <label><input type="checkbox" value="Capuchino"> Capuchino</label>

        <label>Intensidad del café (1 a 5):</label>
        <input type="range">
      </fieldset>

      <button>Enviar</button>
    </form>
  </section>

  <footer>
    <p>Cafetería del Parque</p>
  </footer>

</body>
</html>
